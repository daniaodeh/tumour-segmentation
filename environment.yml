name: tumour-segmentation
channels:
  - pytorch
  - conda-forge
  - nvidia
  - defaults
dependencies:
  # Python and PyTorch with CUDA support (2.7.0+cu128 - needed for RTX 5090
  # sm_120 support locally; also the exact version this pipeline has actually
  # been run and debugged against, including extensive OpenSlide-specific
  # read-failure diagnosis - keep pinned to this rather than the originally
  # intended 2.5/cu121, even on hardware that wouldn't strictly require cu128)
  - python=3.10
  - pandas
  - scikit-learn
  - matplotlib
  - scipy
  - toml
  - pip
  - jupyter
  - ipython
  - pip:
    # --extra-index-url (not --index-url) so PyPI is still used for every
    # other package below - only torch/torchvision/torchaudio actually
    # resolve from this index.
    - --extra-index-url https://download.pytorch.org/whl/cu128
    - torch==2.7.0
    - torchvision
    - torchaudio
    - numpy==1.26.4
    - opencv-python-headless==4.5.5.64
    - albumentations==1.1.0
    - timm==0.4.12
    - segmentation-models-pytorch==0.2.1
    - torchinfo==1.6.3
    - openslide-python==1.4.6
    - openslide-bin==4.0.1.2